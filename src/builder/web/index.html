<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Landing view: shown when no cwd is set (launched without argv).
       The researcher drops files or clicks a button to pick them. -->
  <div id="landing" class="landing hidden">
    <div class="landing-card">
      <div class="landing-logo">Builder</div>
      <h1>Share data with Claude</h1>
      <p class="landing-lead">
        Choose the data files you want Claude to help you analyze.
        They stay on this machine — Claude only sees schema and
        disclosure-controlled summaries.
      </p>

      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-main">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="drop-zone-hint">Drop one or more .csv, .dta, or .rds files</p>
          <p class="drop-zone-sub">2 GB per file · for larger, use Choose files…</p>
        </div>
      </div>

      <div class="landing-actions">
        <button id="choose-files-btn" type="button" class="landing-btn primary">Choose files…</button>
        <button id="choose-folder-btn" type="button" class="landing-btn">Choose folder…</button>
      </div>

      <div id="landing-status" class="landing-status"></div>
    </div>
  </div>

  <!-- Chat view: shown once the session's working directory is set. -->
  <div id="chat" class="chat hidden">
    <header class="topbar">
      <div class="topbar-title">Builder</div>
      <div class="topbar-meta" id="topbar-meta">
        <span id="cwd-display"></span>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="message system">
        <div class="message-body" id="welcome">
          Ready.
        </div>
      </div>
    </main>

    <footer class="composer">
      <form id="compose-form">
        <textarea
          id="compose-input"
          placeholder="Ask Claude about your data. Shift-Enter for a new line."
          rows="1"
          autofocus
        ></textarea>
        <div class="composer-bar">
          <div class="composer-bar-spacer"></div>
          <button
            type="submit"
            id="send-btn"
            class="composer-action"
            aria-label="Send"
            title="Send (Enter)"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
          <button
            type="button"
            id="stop-btn"
            class="composer-action stop hidden"
            aria-label="Stop"
            title="Stop"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="1"/>
            </svg>
          </button>
        </div>
      </form>

      <!-- Status bar below the composer — hosts the Permission chip
           (plus room for future indicators like model/usage). Chip
           lives outside the compose-form now so the chat box stays
           minimal; the popup is anchored above the chip inside
           .permission-wrap, so it follows the chip wherever it sits. -->
      <div class="composer-meta">
        <div class="permission-wrap">
          <button
            type="button"
            id="policy-chip"
            class="composer-chip"
            title="What Claude sees about each dataset — click to change"
          >
            <span id="policy-chip-label">Permission</span>
            <span class="chip-arrow">▾</span>
          </button>
          <div id="policy-popup" class="policy-popup hidden"></div>
        </div>
      </div>
    </footer>
  </div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
