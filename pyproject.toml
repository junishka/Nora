[project]
name = "nora"
version = "0.10.3"
description = "Local privacy layer letting frontier LLMs (Anthropic, OpenAI) drive statistical analysis on a researcher's own machine (macOS-only at this stage)"
authors = [
    {name = "Junishka Byun", email = "jbyun@iese.edu"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    # Platform scope: `submit_script` relies on macOS `sandbox-exec` for
    # its privacy boundary. Non-macOS platforms can run the chat and
    # schema tools but scripts refuse to execute. Do not promise what
    # the code cannot enforce.
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
]
dependencies = [
    "claude-agent-sdk>=0.1.61",
    # Schema extractors (step 3).
    # pyreadstat: .dta (Stata) with variable labels, value labels, types.
    # pyreadr: .rds / .rda / .RData (R), pure-Python port, no R needed.
    # pandas: type inference for .csv and the DataFrame lingua franca that
    # pyreadstat/pyreadr return. Heavy dep, but pyreadstat requires it anyway.
    "pyreadstat>=1.2",
    "pyreadr>=0.5",
    "pandas>=2.0",
    # Parquet support. ``pandas.read_parquet`` dispatches to pyarrow
    # by default; declaring it explicitly removes the "no engine" error
    # researchers would otherwise get the first time they upload a
    # ``.parquet`` file. Also enables ``.feather`` if we add it later.
    "pyarrow>=15",
    # UI shell (`nora` entry point). pywebview wraps a native WKWebView
    # window on macOS, so no Chromium is bundled. ~25 MB added to the
    # .app rather than ~120 MB for Electron.
    "pywebview>=5.0",
    # Multi-provider auth: ``keyring`` brokers credentials through the
    # OS-native secret store (macOS Keychain). API keys never touch
    # disk in cleartext: Nora reads via ``auth.get_credential`` and
    # writes via ``auth.set_credential``. The Claude CLI subscription
    # path bypasses keyring (uses its own ``~/.claude.json`` token);
    # only API-key creds (Anthropic, OpenAI) flow through keyring.
    "keyring>=24",
    # OpenAI provider. Used only when the researcher picks an OpenAI
    # model in the picker; ``provider/openai.py`` lazy-imports it so
    # an Anthropic-only install doesn't pay the dep cost at startup.
    "openai>=1.50",
]

[project.scripts]
nora = "nora.ui:main"

[dependency-groups]
dev = [
    # Property-based testing is the backbone of the sanitizer's correctness
    # proof: generate adversarial payloads, assert post-sanitize invariants.
    "pytest>=8",
    "hypothesis>=6",
    # Packaging: PyInstaller produces a self-contained macOS binary the
    # .app launcher wraps. See packaging/ for the build pipeline.
    "pyinstaller>=6.0",
    # Real-fit audit tests for ``nora.from_lm`` (Python helper). The
    # runtime itself never requires statsmodels — only researcher
    # scripts that fit GLMs do, and the executor reports a clean
    # install hint when it's missing. Pulling it into the dev group
    # lets ``tests/test_from_lm_python_real_fits.py`` fit real
    # ``OLS`` / ``Logit`` / ``Probit`` / ``Poisson`` / ``NegativeBinomial``
    # / ``PHReg`` / ``IV2SLS`` / ``MixedLM`` models and assert the
    # helper emits sanitizer-valid + inference-adequate payloads,
    # rather than relying on the older mocked-fit tests (which proved
    # silent helper failures on Cox PH and feols are easy to ship).
    # scipy is a transitive (statsmodels needs it for distributions).
    "statsmodels>=0.14",
    "scipy>=1.11",
    "rdrobust>=2.0.0",
    "differences>=0.3.0",
    # scikit-learn upper-bound pinned <1.7 for factor_analyzer 0.5.1
    # compatibility. DO NOT BUMP without verifying factor_analyzer
    # has shipped a release that calls ``check_array(ensure_all_finite=...)``
    # instead of the removed ``force_all_finite=...`` kwarg. Symptom of
    # an unsafe bump: ``nora.from_factor_analyzer`` and
    # ``tests/test_from_factor_analyzer_real_fits.py`` start failing with
    # ``TypeError: check_array() got an unexpected keyword argument
    # 'force_all_finite'`` — the FA helper goes silent rather than
    # surfacing a clean error, so this guard is load-bearing.
    "scikit-learn>=1.5,<1.7",
    # Sun-Abraham IW event study, used by ``tests/test_from_sun_abraham_real_fits.py``.
    # pyfixest mirrors R fixest's ``sunab()`` API (Borusyak-Jaravel-Spiess
    # 2024 reference; pin loose so a maintenance release flows through).
    "pyfixest>=0.18",
    # Python-side exploratory factor analysis (the analogue of R
    # psych::fa). Powers ``nora.from_factor_analyzer`` and its real-fit
    # pin under ``tests/test_from_factor_analyzer_real_fits.py``.
    "factor_analyzer>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --hypothesis-show-statistics"
