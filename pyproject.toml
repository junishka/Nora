[project]
name = "nora"
version = "0.0.1"
description = "Local privacy layer letting Claude drive statistical analysis on a researcher's own machine (macOS-only at this stage)"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    # Platform scope: `submit_script` relies on macOS `sandbox-exec` for
    # its privacy boundary. Non-macOS platforms can run the chat and
    # schema tools but scripts refuse to execute. Do not promise what
    # the code cannot enforce.
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
]
dependencies = [
    "claude-agent-sdk>=0.1.61",
    "rich>=13.0",
    # Schema extractors (step 3).
    # pyreadstat: .dta (Stata) with variable labels, value labels, types.
    # pyreadr: .rds / .rda / .RData (R) — pure-Python port, no R needed.
    # pandas: type inference for .csv and the DataFrame lingua franca that
    # pyreadstat/pyreadr return. Heavy dep, but pyreadstat requires it anyway.
    "pyreadstat>=1.2",
    "pyreadr>=0.5",
    "pandas>=2.0",
    # Web UI shell (`nora-ui` entry point). pywebview wraps a native
    # WKWebView window on macOS — no Chromium bundled, ~25 MB added to
    # the .app rather than ~120 MB for Electron. Terminal UI (`nora`)
    # keeps working without it; pywebview is imported lazily by the UI
    # entry point.
    "pywebview>=5.0",
]

[project.scripts]
nora = "nora.app:main"
nora-ui = "nora.ui:main"

[dependency-groups]
dev = [
    # Property-based testing is the backbone of the sanitizer's correctness
    # proof: generate adversarial payloads, assert post-sanitize invariants.
    "pytest>=8",
    "hypothesis>=6",
    # Packaging: PyInstaller produces a self-contained macOS binary the
    # .app launcher wraps. See packaging/ for the build pipeline.
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --hypothesis-show-statistics"
